services:
  brain:
    build: .
    env_file: .env
    environment:
      VAULT_DIR: /data/vault
      HOST: 0.0.0.0
      AUTH_STORE_DIR: /data/auth
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - vault:/data/vault
      - auth:/data/auth
    networks:
      - n8n

volumes:
  vault:
  auth:

networks:
  n8n:
    external: true
    name: ${N8N_NETWORK:-n8n}
