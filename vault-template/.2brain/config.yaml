# Vault settings for 2brain. Every key is optional; a missing key takes the value shown here.
# Unknown keys are rejected, so a typo fails loudly instead of being ignored.
version: 1

vault:
  archive_folder: archive
  inbox_folder: inbox

# Canonical property name on the left, the name your notes use on the right.
properties:
  type: type
  area: area
  date: date
  source: source
  source_id: source_id

# Your areas. Each one becomes a top-level folder.
areas: [personal, work]

# Optional allow-list for the source property. Empty means any non-empty string.
sources: []

# Canonical type: the value stored in a note, the folder it belongs in, and the body rule.
# {area} stands for each configured area. A type without folder accepts any safe path.
types:
  meeting: { value: meeting, folder: "{area}/meetings", immutable_body: true }
  analysis: { value: analysis, folder: "{area}/meetings" }
  project: { value: project, folder: "{area}/projects" }
  resource: { value: resource, folder: "{area}/resources" }
  email: { value: email, folder: "{area}/resources" }
  topic: { value: topic, folder: topics }
  person: { value: person, folder: people }
  recipe: { value: recipe, folder: recipes }
  idea: { value: idea, folder: inbox }
  daily: { value: daily, folder: daily }
  review: { value: review, folder: reviews }
  session: { value: session, folder: "{area}/sessions" }

# Meeting settings. Recordings of min_minutes or less are skipped. Dates and times use the zone.
# A default_area of null means the first area. Each area rule has a domain or a calendar, not both.
# Source values are stored in the source property; labels name extra versions of a meeting.
meetings:
  timezone: UTC
  min_minutes: 5
  untitled_label: "Untitled meeting"
  unknown_speaker_label: "Speaker"
  default_area: null
  area_rules: []
  sources:
    fireflies: { value: fireflies, label: "Fireflies" }
    gemini: { value: gemini, label: "Gemini" }
  # Canonical meeting property on the left, the name your notes use on the right.
  properties:
    start: start
    end: end
    duration: duration_minutes
    participants: participants
    calendar_event: calendar_event
    source_title: source_title
    source_url: source_url
    versions: versions
